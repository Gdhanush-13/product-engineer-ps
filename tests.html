<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queue tests</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#172033}li{margin:10px 0}.pass{color:#147a52}.fail{color:#ad343e}code{background:#f1f3f7;padding:2px 5px;border-radius:4px}</style></head><body><h1>Offline queue focused tests</h1><p>These tests run entirely in the browser with an in-memory storage adapter.</p><ol id="results"></ol><script src="app.js"></script><script>
class MemoryStorage{constructor(){this.data=new Map()}getItem(k){return this.data.has(k)?this.data.get(k):null}setItem(k,v){this.data.set(k,String(v))}removeItem(k){this.data.delete(k)}}
const results=document.getElementById('results');
function assert(condition,message){if(!condition)throw new Error(message)}
async function test(name,fn){const li=document.createElement('li');try{await fn();li.className='pass';li.textContent='✓ '+name}catch(error){li.className='fail';li.textContent='✗ '+name+' — '+error.message}results.appendChild(li)}
(async()=>{
 await test('persists an incident created offline across a restart',async()=>{const storage=new MemoryStorage();const first=new QueueEngine({storage,network:'offline'});const created=first.createIncident('Broken gate','high');const restarted=new QueueEngine({storage,network:'offline'});const saved=restarted.incidents()[0];assert(saved.clientId===created.clientId,'client ID changed');assert(saved.state==='pending','pending item should remain recoverable');assert(saved.title==='Broken gate','title was not persisted')});
 await test('keeps a failed sync and succeeds on retry',async()=>{const storage=new MemoryStorage();const queue=new QueueEngine({storage,network:'failing'});const created=queue.createIncident('Low battery','medium');await queue.synchronize();assert(queue.incidents()[0].state==='failed','failure state not visible');queue.setNetwork('online');await queue.synchronizeOne(created.clientId);assert(queue.incidents()[0].state==='synchronized','retry did not synchronize')});
 await test('uses the stable client ID to prevent duplicate server records',async()=>{const storage=new MemoryStorage();const queue=new QueueEngine({storage,network:'online'});const created=queue.createIncident('Duplicate check','critical');await queue.synchronizeOne(created.clientId);const serverCount=queue.serverRecords().length;const local=queue.incidents();local[0].state='pending';queue.saveIncidents(local);await queue.synchronizeOne(created.clientId);assert(queue.serverRecords().length===serverCount,'retry created a duplicate');assert(queue.incidents()[0].state==='synchronized','idempotent retry not synchronized')});
})();
</script></body></html>
